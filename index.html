<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mis canciones</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --blur:saturate(180%) blur(28px);
  --glass-border:rgba(255,255,255,0.85);
  --text:#1c1c1e;
  --text-sec:rgba(60,60,67,0.55);
  --active:#3a3aff;
  --danger:#ff3b30;
  --sep:rgba(60,60,67,0.12);
}
body{
  font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
  background:linear-gradient(145deg,#dfe0f0 0%,#e4dff0 40%,#d8e4f0 100%);
  height:100dvh;display:flex;flex-direction:column;
  overflow:hidden;color:var(--text);user-select:none;
}
.topbar{
  display:flex;align-items:center;justify-content:center;
  padding:52px 22px 16px;
  background:rgba(232,232,240,0.6);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:0.5px solid var(--sep);
  position:relative;z-index:10;
}
.topbar-title{font-size:17px;font-weight:600;letter-spacing:-0.4px;color:var(--text)}
.player-zone{
  display:flex;flex-direction:column;align-items:center;gap:26px;
  padding:32px 24px 28px;
  background:rgba(235,235,244,0.45);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:0.5px solid var(--sep);flex-shrink:0;
}
.now-playing{text-align:center;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:5px}
.now-name{font-size:17px;font-weight:600;letter-spacing:-0.3px;max-width:300px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.now-hint{font-size:13px;color:var(--text-sec)}
.controls{display:flex;align-items:center;gap:22px}
.ctrl{
  border:none;cursor:pointer;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  background:rgba(255,255,255,0.72);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:0.5px solid var(--glass-border);
  box-shadow:0 4px 18px rgba(0,0,0,0.11),0 1.5px 0 rgba(255,255,255,0.96) inset,0 -1px 0 rgba(0,0,0,0.04) inset;
  transition:transform 0.15s cubic-bezier(.34,1.56,.64,1);
  color:var(--text);
}
.ctrl:active{transform:scale(0.86)}
.ctrl::after{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,0.55) 0%,rgba(255,255,255,0) 60%);pointer-events:none}
.ctrl-sm{width:54px;height:54px}
.ctrl-sm svg{width:20px;height:20px}
.ctrl-lg{width:76px;height:76px;background:rgba(255,255,255,0.85);box-shadow:0 6px 28px rgba(0,0,0,0.14),0 1.5px 0 rgba(255,255,255,0.98) inset,0 -1px 0 rgba(0,0,0,0.05) inset}
.ctrl-lg svg{width:30px;height:30px}
.ctrl-lg::after{background:linear-gradient(155deg,rgba(255,255,255,0.7) 0%,rgba(255,255,255,0) 55%)}
.list-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.list-wrap::-webkit-scrollbar{width:0}
.song-item{
  display:flex;align-items:center;gap:14px;
  padding:13px 20px;border-bottom:0.5px solid var(--sep);
  cursor:pointer;
  background:rgba(255,255,255,0.50);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:background 0.12s;
}
.song-item:first-child{border-top:0.5px solid var(--sep)}
.song-item:active{background:rgba(255,255,255,0.75)}
.song-item.active{background:rgba(58,58,255,0.06)}
.song-item.active .sname{color:var(--active)}
.disc{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:rgba(255,255,255,0.45);
  border:0.5px solid rgba(255,255,255,0.75);
  box-shadow:0 2px 8px rgba(0,0,0,0.09),0 1px 0 rgba(255,255,255,0.9) inset;
  display:flex;align-items:center;justify-content:center;
  color:rgba(60,60,67,0.5);
}
.song-item.active .disc{background:rgba(58,58,255,0.10);border-color:rgba(58,58,255,0.25);color:var(--active)}
.sinfo{flex:1;min-width:0}
.sname{font-size:15px;font-weight:500;letter-spacing:-0.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:none;align-items:flex-end;gap:2px;height:16px;flex-shrink:0}
.song-item.active.playing .bars,.song-item.active.paused .bars{display:flex}
.bar{width:3px;border-radius:2px;background:var(--active);transform-origin:bottom}
.bar:nth-child(1){height:7px;animation:bop 0.55s ease-in-out infinite alternate}
.bar:nth-child(2){height:13px;animation:bop 0.55s ease-in-out 0.18s infinite alternate}
.bar:nth-child(3){height:9px;animation:bop 0.55s ease-in-out 0.09s infinite alternate}
@keyframes bop{from{transform:scaleY(0.35)}to{transform:scaleY(1)}}
.song-item.active.paused .bar{animation-play-state:paused}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">Mis canciones</span>
</div>

<div class="player-zone">
  <div class="now-playing">
    <div class="now-name" id="now-name">Sin canción</div>
    <div class="now-hint" id="now-hint">Toca una canción para reproducir</div>
  </div>
  <div class="controls">
    <button class="ctrl ctrl-sm" id="btn-prev">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button class="ctrl ctrl-lg" id="btn-play">
      <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="ctrl ctrl-sm" id="btn-next">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2.5-6 8.5 6V6z"/><path d="M16 6h2v12h-2z"/></svg>
    </button>
  </div>
</div>

<div class="list-wrap" id="list-wrap">
  <div id="song-list"></div>
</div>

<audio id="audio-el"></audio>

<script>
const songs = [
  "Adan Garcia",
  "Amarte Más No Pude, Diomedes Díaz - Letra Oficial",
  "America America",
  "Antonio Aguilar - Caballo Prieto Azabache (Letra Oficial)",
  "Antonio Aguilar - El Hijo Desobediente (Video Oficial)",
  "Antonio Aguilar - La Martina Letra Oficial",
  "Antonio Aguilar - Ya Viene Amaneciendo (Letra Oficial)",
  "Aunque Mal Paguen Ellas",
  "Ay Hombe, Jorge Celedón & Jimmy Zambrano - Video Oficial",
  "Bella y bonita - LOS DOTORES de la carranga",
  "Busco Un Corazón - Raúl Santi Video Lyric Balada",
  "Cali Pachanguero, Grupo Niche - Video Oficial",
  "Camilo Sesto - El Amor De Mi Vida Video TVE_Playback",
  "Camilo Sesto - ¿Quieres Ser Mi Amante_ Audio",
  "Decisiones",
  "Diomedes Díaz - La Suerte Está Echada (Cover Audio)",
  "Diomedes Díaz, Sin Saber Que Me Espera - Vídeo Oficial",
  "El Aguardientosky, Gustavo Quintero - Video Oficial",
  "El Cóndor Herido, Diomedes Díaz Y Juancho Rois - Letra Oficial",
  "El Invierno Pasado",
  "Elvis Crespo - Nuestra Cancion Cover Audio",
  "Elvis Crespo - Suavemente",
  "Enrique Iglesias - Nunca Te Olvidaré Official Music Video",
  "Enrique Iglesias - Si Tú Te Vas",
  "Enrique Iglesias, Juan Luis Guerra - Cuando Me Enamoro",
  "Fantasía Nocturna, Gustavo Quintero - Video Oficial",
  "Gilberto Santa Rosa - Conciencia (Official Video)",
  "Gilberto Santa Rosa - Conteo Regresivo Salsa Version",
  "Gilberto Santa Rosa - Sin Voluntad Official Video",
  "GOLPE CON GOLPE - Pastor López (Letra)",
  "Guayacan Orquesta - Cuando Hablan Las Miradas",
  "Guayacán Orquesta - Amé a Mi Manera (Video Oficial)",
  "Heredero - Sabor a Derrota (Video oficial)",
  "Jerry Rivera - Amores Como el Nuestro Audio",
  "Jerry Rivera - Cara de Niño (Cover Audio Video)",
  "Jerry Rivera - Dame un beso asi",
  "Jerry Rivera - Qué Hay de Malo Cover Audio Video",
  "Jorge Celedón - Mi Locura Video Oficial",
  "Jorge Celedón - No Merezco Tanto Silencio l Video Oficial ®",
  "Jorge Celedón - Por Gustarte l Video Oficial ®",
  "Jorge Oñate - No Comprendi Tu Amor Cover Audio",
  "JORGE VELOSA - LA CUCHARITA",
  "José Alfredo Jimenez - Si Nos Dejan (LETRA)",
  "José Alfredo Jiménez - El Ultimo Trago (LETRA)",
  "José Alfredo Jiménez - No Me Amenaces Letra _ Lyrics",
  "José Luis Rodríguez - Agárrense de las Manos",
  "José Luis Rodríguez - Culpable Soy Yo",
  "La China Que Yo Tenia",
  "La Noche Mas Linda",
  "La Pelea Del Siglo, Gustavo Quintero - Video Oficial",
  "La vida no vale nada",
  "las diabluras-Jorge Velosa y Los Carrangueros",
  "Lo Pasado No Perdona",
  "Los Dotores De La Carranga - El Sermón De Mi Mujer",
  "Los Dotores De La Carranga - La De Estrato 8 [Video Oficial]",
  "Me Hace Daño Verte",
  "Me Tengo Que Ir",
  "Mi Biografía, Diomedes Díaz - Letra Oficial",
  "Mi Despedida – Raúl Santi Video Lyric",
  "Nino Bravo - Un Beso Y Una Flor 1972 Clip",
  "NOELIA-NINO BRAVO Video Original",
  "Oiga, Mire, Vea (Salsa)",
  "Oro Solido - La Tanguita Roja (OFFICIAL)",
  "Pecos - Hablame de Ti Video TVE Playback",
  "Pecos - Que No Lastimen a Tu Corazon Video TVE Playback",
  "Piensame",
  "Procura",
  "Que Locura Enamorarme De Ti",
  "RAUL SANTI -COMO UN PICAFLOR (ESPECTACULARES JES)",
  "Ruben Blades - Amor Y Control (LetraLyrics)",
  "Si No Me Abrazas - Jorge Oñate Discos Fuentes",
  "Soda Stereo - De Música Ligera (Official Video)",
  "Te amo, Te extraño- Guayacán Orquesta",
  "Tu Eres Ajena",
  "Vicente Fernández - Acá Entre Nos (En Vivo)",
  "Vicente Fernández - Borracho Te Recuerdo (Letra Lyrics)",
  "Vicente Fernández - No Me Sé Rajar Letra",
  "Volver, Volver",
  "Wilfrido Vargas - El Jardinero",
  "Ya Me Voy - Raúl Santi Video Letra Oficial - Balada Romántica Clásica",
  "Yo No Sé Mañana"
];

let current = -1, playing = false;
const audio = document.getElementById('audio-el');
const nowName = document.getElementById('now-name');
const nowHint = document.getElementById('now-hint');
const playIcon = document.getElementById('play-icon');
const songList = document.getElementById('song-list');

function render() {
  songList.innerHTML = '';
  songs.forEach((s, i) => {
    const isActive = i === current;
    const div = document.createElement('div');
    div.className = 'song-item' + (isActive ? ' active' : '') + (isActive && playing ? ' playing' : '') + (isActive && !playing && current >= 0 ? ' paused' : '');
    div.innerHTML = `
      <div class="disc">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="2.5"/><path d="M12 9.5V4.5"/>
        </svg>
      </div>
      <div class="sinfo"><div class="sname">${esc(s)}</div></div>
      <div class="bars" aria-hidden="true"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>`;
    div.addEventListener('click', () => playSong(i));
    songList.appendChild(div);
  });
  if (current >= 0) {
    const el = songList.children[current];
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

function playSong(idx) {
  if (idx === current && playing) { audio.pause(); playing = false; updateIcon(); render(); return; }
  current = idx;
  audio.src = songs[idx] + '.mp3';
  nowName.textContent = songs[idx];
  nowHint.textContent = '';
  audio.play().then(() => { playing = true; updateIcon(); render(); }).catch(() => {
    nowHint.textContent = 'No se pudo reproducir';
  });
}

function togglePlay() {
  if (songs.length === 0) return;
  if (current < 0) { playSong(Math.floor(Math.random() * songs.length)); return; }
  if (playing) { audio.pause(); playing = false; } else { audio.play().then(() => { playing = true; }).catch(() => {}); }
  updateIcon(); render();
}

function playNext() {
  if (!songs.length) return;
  playSong((current + 1) % songs.length);
}

function playPrev() {
  if (!songs.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  playSong((current - 1 + songs.length) % songs.length);
}

function updateIcon() {
  playIcon.innerHTML = playing ? '<path d="M6 19h4V5H6zm8-14v14h4V5z"/>' : '<path d="M8 5v14l11-7z"/>';
}

audio.addEventListener('ended', playNext);
document.getElementById('btn-play').addEventListener('click', togglePlay);
document.getElementById('btn-next').addEventListener('click', playNext);
document.getElementById('btn-prev').addEventListener('click', playPrev);

render();
</script>
</body>
</html>
